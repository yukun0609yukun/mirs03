# 秘密情報の雛形(コミットして良い。実値は書かないこと)。
# 使い方: このファイルを secrets.local.yaml にコピーして CHANGE_ME を実値に置き換える。
#   cp secrets.example.yaml secrets.local.yaml
# secrets.local.yaml は .gitignore で除外されており、git/GitHubには載らない。
# Jetson等の実機にも、同じパス(nokosahen_bringup/config/secrets.local.yaml)へ
# 手動でコピーする(または ~/.nokosahen_secrets.yaml、環境変数 NOKOSAHEN_SECRETS_FILE でも可)。
# 環境変数 NOKOSAHEN_<セクション>_<キー>(例: NOKOSAHEN_FULL_DASHBOARD_AUTH_PASSWORD)でも
# 個別に上書きできる。CHANGE_MEのまま/空だと、そのアカウントは起動ごとにランダムな
# パスワードになりログインできない(認証が黙って無効になることはない)。
web_ui:
  auth_password: "CHANGE_ME"
menu_schedule:
  auth_password: "CHANGE_ME"
stage1_dashboard:
  auth_password: "CHANGE_ME"
stage2_dashboard:
  auth_password: "CHANGE_ME"
  restricted_password: "CHANGE_ME"
full_dashboard:
  auth_password: "CHANGE_ME"
  restricted_password: "CHANGE_ME"
