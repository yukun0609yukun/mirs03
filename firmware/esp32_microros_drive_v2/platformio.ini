[env:esp32dev]
platform = espressif32@6.7.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; 921600だと基板(USB-シリアルチップ)によっては書き込み時にハングすることが
; あった(2026-07-10、CP210xチップの個体で確認)ため、より安定する速度に
; 下げている。書き込みに時間はかかるが確実性を優先する。
upload_speed = 115200
; micro_ros_platformio(PlatformIO向け補助パッケージ)はビルド時にcolcon経由で
; micro-ROSをソースからビルドするが、そのビルドスクリプトはbash前提の構文を
; 含んでおり、Ubuntu既定の/bin/sh(dash)では構文エラーで失敗する
; (WSL2/Ubuntu 22.04で確認)。この経路は使わない。
;
; 代わりに生のmicro_ros_arduinoリポジトリ(プリコンパイル済みのlibmicroros.a
; 同梱、ソースビルド不要)を使う。ただし同梱のlibmicroros.aは、Arduinoの
; precompiledライブラリ命名規則(lib<ライブラリ名>.a = libmicro_ros_arduino.a)
; と実際のファイル名(libmicroros.a)が一致しないため、PlatformIOのLDFが
; 自動リンクしてくれない(undefined reference多数で失敗する)。
; そのため下のbuild_flagsで対象アーキテクチャ(esp32)のlibmicroros.aを
; 明示的にリンクする。
lib_deps =
  https://github.com/micro-ROS/micro_ros_arduino.git#humble
build_flags =
  -DARDUINO_ARCH_ESP32
  -L$PROJECT_LIBDEPS_DIR/esp32dev/micro_ros_arduino/src/esp32
  -lmicroros

